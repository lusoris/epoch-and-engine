name: Auto-merge fleet PRs

# The fleet holds git credentials but NO forge API token, so it opens PRs over
# AGit (`git push origin HEAD:refs/for/main`) and can propose but never
# integrate. Without this, agent PRs accumulate unmerged and the site never
# changes — which is exactly what happened to the sibling thedesknook.com repo,
# where eight green PRs sat open while the published site stayed frozen.
#
# This arms Gitea's native auto-merge so a PR lands the moment its required
# check passes, and never before. The gate is enforced server-side by branch
# protection on main (required context "Static export quality / static-export
# (pull_request)"), not by this workflow: a plain merge of a red PR is rejected
# with HTTP 405 "Not all required status checks successful".
#
# Do NOT gate on the PR's `mergeable` field. In Gitea that reflects merge
# CONFLICTS only — red PRs report mergeable=true. Status is the real gate.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Arm auto-merge
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::no GITEA_TOKEN in scope — auto-merge cannot be armed"
            exit 1
          fi
          # AGit-authored PRs only. This USED to be a job-level
          #   if: startsWith(github.event.pull_request.head.ref, 'refs/pull/')
          # which never once matched: Gitea's webhook payload does not carry
          # refs/pull/N/head in head.ref even though the REST API reports
          # exactly that for the same PR. Every fleet PR was therefore left
          # unarmed — 4/4 runs "skipped" in this repo — and PRs accumulated
          # open, which is the precise failure the header above warns about.
          # Ask the API instead of trusting the event payload. A human on a
          # named topic branch still reports a branch name and is left alone.
          if ! curl -sS --retry 2 --retry-delay 3 -o /tmp/pr.json \
              -H "Authorization: token ${TOKEN}" \
              "${API}/repos/${REPO}/pulls/${PR}"; then
            echo "::error::cannot read PR ${PR} to classify its head ref"
            exit 1
          fi
          # Note: a MERGED PR whose branch was deleted also reports
          # refs/pull/N/head. That is harmless here — this only runs on
          # opened/reopened/synchronize, while a human's branch still exists.
          if ! grep -q '"ref":"refs/pull/' /tmp/pr.json; then
            echo "not an AGit fleet PR — leaving it for a human to merge"
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"Do":"squash","merge_when_checks_succeed":true,"delete_branch_after_merge":true}' \
            "${API}/repos/${REPO}/pulls/${PR}/merge")
          echo "response: $(cat /tmp/resp)"
          # 201 = scheduled, merges when the required check goes green.
          # 200 = checks were already green, merged now.
          # 405 = required checks not successful AND auto-merge unavailable;
          #       the PR simply stays open, which is the correct outcome.
          case "${code}" in
            200) echo "merged immediately (checks already green)" ;;
            201) echo "auto-merge armed; will land when the required check passes" ;;
            405) echo "not mergeable yet — left open for the next check run" ;;
            409) echo "already scheduled or merge in progress" ;;
            *)   echo "::error::unexpected HTTP ${code} arming auto-merge"; exit 1 ;;
          esac
